<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' | Quản lý Thư viện & Sách' : 'Quản lý Thư viện & Sách'}">Quản lý Thư viện &amp; Sách</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar(activeMenu)" class="navbar navbar-expand-lg navbar-custom sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" th:href="@{/books}">
            <span class="brand-icon-box">
                <i class="bi bi-journal-bookmark-fill fs-5"></i>
            </span>
            <span class="navbar-brand-custom">BookStore Pastel</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <i class="bi bi-list fs-3 text-secondary"></i>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeMenu == 'books'} ? 'active' : ''" th:href="@{/books}">
                        <i class="bi bi-book-half me-1"></i> Danh sách Sách
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeMenu == 'categories'} ? 'active' : ''" th:href="@{/categories}">
                        <i class="bi bi-tags me-1"></i> Thể loại
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeMenu == 'borrows'} ? 'active' : ''" th:href="@{/borrows}">
                        <i class="bi bi-arrow-left-right me-1"></i> Mượn / Trả Sách
                    </a>
                </li>
            </ul>
            <div class="d-flex gap-2">
                <a th:href="@{/books/new}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-plus-circle me-1"></i> Thêm sách
                </a>
                <a th:href="@{/borrows/new}" class="btn btn-sm btn-primary">
                    <i class="bi bi-bookmark-heart-fill me-1"></i> Đăng ký Mượn sách
                </a>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="container">
    <div th:if="${successMessage}" class="alert alert-pastel-success alert-dismissible fade show d-flex align-items-center shadow-sm mb-4 py-3 px-4" role="alert">
        <i class="bi bi-check-circle-fill fs-5 me-2"></i>
        <div class="fw-semibold" th:text="${successMessage}">Thao tác thành công!</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-pastel-danger alert-dismissible fade show d-flex align-items-center shadow-sm mb-4 py-3 px-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
        <div class="fw-semibold" th:text="${errorMessage}">Đã có lỗi xảy ra!</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<footer th:fragment="footer" class="py-3 mt-5">
    <div class="container d-flex flex-wrap justify-content-between align-items-center text-muted small">
        <div>
            <strong style="color: #6d28d9;">BookStore Pastel Library</strong> &mdash; Java 17 &bull; Spring Boot 3 &bull; Thymeleaf &bull; Spring Data JPA &bull; MySQL
        </div>
        <div class="d-flex gap-3">
            <a th:href="@{/books}" class="text-decoration-none text-muted">Sách</a>
            <a th:href="@{/categories}" class="text-decoration-none text-muted">Thể loại</a>
            <a th:href="@{/borrows}" class="text-decoration-none text-muted">Phiếu mượn</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>

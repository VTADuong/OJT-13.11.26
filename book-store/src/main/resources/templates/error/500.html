<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lỗi hệ thống')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container mb-5">
    <div class="card-modern error-404-box shadow-sm">
        <div class="mb-3 text-danger">
            <i class="bi bi-exclamation-octagon-fill" style="font-size: 4rem;"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2"
            th:text="${errorTitle != null ? errorTitle : 'Đã xảy ra lỗi xử lý yêu cầu'}">
            Đã xảy ra lỗi xử lý yêu cầu
        </h3>
        <p class="text-muted mb-4"
           th:text="${errorMessage != null ? errorMessage : 'Có lỗi không mong muốn xảy ra trong quá trình xử lý. Vui lòng thử lại.'}">
            Có lỗi không mong muốn xảy ra trong quá trình xử lý. Vui lòng thử lại.
        </p>

        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a th:href="@{/books}" class="btn btn-primary fw-semibold px-4">
                <i class="bi bi-house-door-fill me-1"></i> Về Trang Danh sách Sách
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('404 - Không tìm thấy trang')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container mb-5">
    <div class="card-modern error-404-box shadow-sm">
        <div class="mb-3">
            <span class="error-code-badge">404</span>
        </div>
        <h3 class="fw-bold text-dark mb-2"
            th:text="${errorTitle != null ? errorTitle : 'Không tìm thấy trang hoặc dữ liệu (404)'}">
            Không tìm thấy trang hoặc dữ liệu (404)
        </h3>
        <p class="text-muted mb-3"
           th:text="${errorMessage != null ? errorMessage : 'Rất tiếc, trang hoặc dữ liệu bạn đang tìm kiếm không tồn tại, đã bị xoá hoặc đường dẫn không chính xác.'}">
            Rất tiếc, trang hoặc dữ liệu bạn đang tìm kiếm không tồn tại, đã bị xoá hoặc đường dẫn không chính xác.
        </p>

        <div th:if="${requestUri != null}" class="mb-4">
            <span class="small text-secondary">Đường dẫn truy cập: </span>
            <code class="code-pill text-danger" th:text="${requestUri}">/duong-dan-khong-ton-tai</code>
        </div>

        <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
            <a th:href="@{/books}" class="btn btn-primary fw-semibold px-4">
                <i class="bi bi-house-door-fill me-1"></i> Về Trang Danh sách Sách
            </a>
            <a th:href="@{/borrows}" class="btn btn-outline-primary fw-semibold px-3">
                <i class="bi bi-arrow-left-right me-1"></i> Trang Mượn / Trả Sách
            </a>
            <a th:href="@{/categories}" class="btn btn-outline-secondary px-3">
                <i class="bi bi-tags me-1"></i> Quản lý Thể loại
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

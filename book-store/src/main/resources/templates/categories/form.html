<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit ? 'Cập nhật Thể loại' : 'Thêm Thể loại mới'})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('categories')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a th:href="@{/categories}" class="text-decoration-none">Thể loại Sách</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${isEdit ? 'Cập nhật thể loại' : 'Thêm thể loại mới'}">Thêm thể loại mới</li>
                    </ol>
                </nav>
                <a th:href="@{/categories}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại
                </a>
            </div>

            <div class="card-modern p-4 p-md-5">
                <div class="border-bottom pb-3 mb-4">
                    <h3 class="fw-bold mb-1">
                        <i th:class="${isEdit ? 'bi bi-pencil-square text-primary me-2' : 'bi bi-tag-fill text-primary me-2'}"></i>
                        <span th:text="${isEdit ? 'Cập nhật Thể loại Sách' : 'Thêm Thể loại Sách mới'}">Thêm Thể loại</span>
                    </h3>
                    <p class="text-muted small mb-0">
                        Tên thể loại là duy nhất (không trùng với các thể loại đã có).
                    </p>
                </div>

                <form th:action="${isEdit ? '/categories/' + categoryForm.id : '/categories'}"
                      th:object="${categoryForm}"
                      method="post"
                      novalidate>

                    <div class="mb-4">
                        <label for="name" class="form-label fw-semibold">
                            Tên thể loại <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               class="form-control form-control-lg"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                               placeholder="VD: Công nghệ thông tin, Văn học Việt Nam...">
                        <div th:if="${#fields.hasErrors('name')}" class="field-error-msg">
                            <i class="bi bi-exclamation-circle-fill"></i>
                            <span th:errors="*{name}">Lỗi tên thể loại</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/categories}" class="btn btn-light border px-4">Huỷ bỏ</a>
                        <button type="submit" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-check2-circle me-1"></i>
                            <span th:text="${isEdit ? 'Lưu cập nhật' : 'Thêm thể loại'}">Lưu</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

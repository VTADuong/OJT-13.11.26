spring.application.name=book-store
server.port=${SERVER_PORT:8080}

# =============================================================================
# MySQL Database Configuration
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/book_store_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool Configuration
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.AutoCommit=true

# =============================================================================
# JPA / Hibernate Configuration
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# Thymeleaf & Web MVC Configuration
# =============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

# Seed initial sample data automatically when database is empty
app.seed.enabled=${APP_SEED_ENABLED:true}
